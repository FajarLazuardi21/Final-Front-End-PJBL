<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Masuk | Nyamanin</title>
    <link rel="stylesheet" href="login.css">
  </head>
  <body>
    <!-- Video background full layar -->
    <video class="video-latar" autoplay muted loop playsinline preload="auto" poster="img/Gambar depan villa/gambar (11).jpg">
      <source src="video/villa.mp4" type="video/mp4">
      <source src="video/villa.webm" type="video/webm">
    </video>
    <div class="overlay-latar"></div>

    <main class="auth-wrapper">
      <div class="kartu auth-kartu">
        <div class="auth-header">
          <a class="logo-link" href="index.html">nyamanin.com</a>
          <h1>Masuk ke Akun</h1>
          <p class="sub">Selamat datang kembali! Masuk untuk kelola pesanan villa Anda.</p>
        </div>

        <form class="auth-form" action="profile.html">
          <label class="label-grup">
            <span class="label-teks">E-mail</span>
            <input class="isian isian-timbul" type="email" placeholder="nama@email.com" required>
          </label>

          <label class="label-grup">
            <span class="label-teks">Kata Sandi</span>
            <input class="isian isian-timbul" type="password" placeholder="Masukkan kata sandi" minlength="8" required>
          </label>

          <div class="auth-opsi">
            <label class="cek">
              <input type="checkbox" name="ingat">
              <span>Ingat saya</span>
            </label>
            <a class="lupa-sandi" href="#">Lupa kata sandi?</a>
          </div>

          <button class="tombol tombol-timbul penuh" type="submit">Masuk</button>
        </form>

        <p class="auth-ganti">Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
      </div>
    </main>
  </body>
</html>
